# Cloudflare 配置（D1 数据库绑定）
# 使用前：npx wrangler login
# 建库：npx wrangler d1 create article-db -> 把输出的 database_id 填到下面
name = "article-site"
compatibility_date = "2026-09-27"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "article-db"
database_id = "9051caef-e987-4a47-ae8c-2f91496b1a82"
